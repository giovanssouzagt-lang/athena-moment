# Relatório semanal: toda sexta às 19h30 (Brasília), uma hora depois do robô diário.
# Em semana com feriado na sexta, ele usa os sinais dos dias que houve pregão.
name: Relatório semanal

on:
  schedule:
    - cron: "30 22 * * 5" # 22h30 UTC = 19h30 em Brasília, sexta-feira
  workflow_dispatch:

jobs:
  relatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://ocowyxkktyyjhmseelzc.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python gerar_relatorio.py
