# Robô diário: roda a estratégia Athena depois do fechamento da B3 e envia
# o Top 5 para o Supabase. Também pode ser disparado à mão na aba "Actions".
name: Sinal diário

on:
  schedule:
    - cron: "30 21 * * 1-5" # 21h30 UTC = 18h30 em Brasília, segunda a sexta
  workflow_dispatch:

jobs:
  gerar-sinal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://ocowyxkktyyjhmseelzc.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testar a estratégia (precisa dar o mesmo Top 5 da versão validada)
        run: pytest -q

      - name: Gerar e enviar o sinal do dia
        run: python gerar_sinal.py
